<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Celsius's Site</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/jpeg" href="LOGO.jpg">
</head>

<body class="bg-[#0D1117] text-[#F0F6FC]">

    <!-- Header -->
    <div class="flex flex-col items-center gap-3 mx-auto my-3
                border-2 border-[#30363D] p-3 w-fit rounded-2xl
                transition-all duration-300
                hover:-translate-y-1 hover:border-[#00D9FF]">

        <div class="flex items-center gap-3">
            <img src="LOGO.jpg"
                 width="80"
                 class="rounded-2xl my-3 mx-2">

            <h1 class="text-4xl font-bold">
                Hi, I am Celsius
            </h1>
        </div>

        <div class="flex gap-3">
            <a href="https://github.com/Sunray-hub" target="_blank">
                <img src="2111432.png"
                     width="40"
                     class="bg-white rounded-xl">
            </a>

            <a href="https://discord.com/users/1419953854157553666" target="_blank">
                <img src="image.png"
                     width="40"
                     class="bg-white rounded-xl">
            </a>

            <a href="https://www.youtube.com/@SiliconAcid" target="_blank">
                <img src="Youtube.png"
                     width="40"
                     class="bg-white rounded-xl">
            </a>
        </div>
    </div>


    <!-- Typing text -->
    <div class="flex flex-col items-center gap-3 mx-auto my-3
                border-2 border-[#30363D] p-3 w-fit rounded-2xl
                transition-all duration-300
                hover:-translate-y-1 hover:border-[#00D9FF]">

        <p class="text-2xl" id="typing">
            I am
        </p>

    </div>


    <!-- About section + Celsius -->
    <div class="flex flex-col md:flex-row items-center justify-center
                gap-4 md:gap-6 mx-auto my-6 px-4">

        <!-- Floating Celsius -->
        <img
            src="FloatingCelsius.png"
            alt="Celsius"
            class="w-32 sm:w-36 md:w-44 lg:w-52
       shrink-0
       order-2 md:order-1"
        >

        <!-- About text -->
        <div class="flex flex-col items-center gap-3
                    border-2 border-[#30363D]
                    p-3 rounded-2xl
                    transition-all duration-300
                    hover:-translate-y-1 hover:border-[#00D9FF]
                    text-center
                    order-1 md:order-2">

            <p class="text-lg sm:text-xl">
                I am a 13 year old hobbyist coder as you can see above.
                <br>
                I love astronomy, electronics and coding!
                And I am also trying to homelab!
            </p>

        </div>

    </div>


    <!-- Terminal -->
    <div class="flex flex-col items-center gap-3
                mx-auto my-3
                border-2 border-[#30363D]
                p-3 w-[95%] sm:w-fit
                rounded-2xl
                transition-all duration-300
                text-center">

        <div class="font-mono text-lg w-full">

            <div class="bg-[#0d1117]
                        border border-[#30363d]
                        rounded-xl
                        p-4
                        w-full
                        sm:min-w-[500px]
                        font-mono text-sm
                        shadow-lg text-left">

                <div id="terminal">

                    <!-- Initial screen -->
                    <div id="intro">

                        <span class="text-green-400">
                            celsius@site
                        </span>:<span class="text-blue-400">~</span>$

                        <span id="terminal-output">
                            I know some coding languages!
                        </span>

                    </div>


                    <!-- Run button -->
                    <button
                        class="px-4 py-2
                               bg-[#161B22]
                               border border-[#30363D]
                               rounded-lg
                               font-mono
                               text-green-400
                               hover:border-green-400
                               hover:-translate-y-1
                               transition-all duration-200
                               my-2"
                        id="RunBtn">

                        $ Run Command

                    </button>


                    <!-- Result -->
                    <p id="Result"></p>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
