<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook | Celsius</title>
    <meta name="description" content="Leave a message in Celsius's guestbook.">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0D1117] text-[#F0F6FC]">
    <main class="mx-auto w-[calc(100%-2rem)] max-w-2xl py-10 sm:py-16">
        <a href="index.html" class="font-mono text-sm text-cyan-300 hover:text-cyan-200">&larr; Back to home</a>

        <header class="mt-7 border-l-2 border-cyan-400 pl-5">
            <p class="font-mono text-sm text-cyan-300">/guestbook</p>
            <h1 class="mt-2 text-4xl font-bold">Sign the guestbook</h1>
            <p class="mt-3 text-[#C9D1D9]">Hello, internet person. Leave a kind message or say hi.</p>
        </header>

        <section class="mt-8 border border-[#30363D] bg-[#161B22] p-5 sm:p-6" aria-labelledby="write-message-title">
            <h2 id="write-message-title" class="text-2xl font-bold">Write a message</h2>
            <form id="guestbook-form" class="mt-5 space-y-4">
                <div>
                    <label for="guest-name" class="mb-2 block text-sm font-semibold">Name</label>
                    <input id="guest-name" name="name" required maxlength="40" autocomplete="name" class="w-full border border-[#30363D] bg-[#0D1117] px-3 py-2 outline-none focus:border-cyan-400" placeholder="Your name">
                </div>
                <div>
                    <label for="guest-message" class="mb-2 block text-sm font-semibold">Message</label>
                    <textarea id="guest-message" name="message" required maxlength="500" rows="5" class="w-full resize-y border border-[#30363D] bg-[#0D1117] px-3 py-2 outline-none focus:border-cyan-400" placeholder="Be nice. Please don't make anything catch fire."></textarea>
                </div>
                <div class="hidden" aria-hidden="true">
                    <label for="guest-website">Website</label>
                    <input id="guest-website" name="website" tabindex="-1" autocomplete="off">
                </div>
                <button id="submit-message" type="submit" class="border border-cyan-400/50 px-4 py-2 font-mono text-sm text-cyan-300 transition-colors hover:bg-cyan-400/10">Sign guestbook</button>
                <p id="form-status" class="text-sm text-[#8B949E]" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="mt-8" aria-labelledby="messages-title">
            <div class="flex items-center justify-between gap-4">
                <h2 id="messages-title" class="text-2xl font-bold">Messages</h2>
                <button id="refresh-messages" type="button" class="font-mono text-sm text-cyan-300 hover:text-cyan-200">Refresh</button>
            </div>
            <p id="messages-status" class="mt-3 text-sm text-[#8B949E]" role="status" aria-live="polite">Loading messages...</p>
            <div id="guestbook-messages" class="mt-4 space-y-4"></div>
        </section>
    </main>
    <script src="guestbook.js"></script>
</body>
</html>
